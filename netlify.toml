# Netlify configuration.
#
# The Next.js runtime (v5) is detected automatically — no plugin entry needed.
# What is NOT automatic is native-binary handling, which this app depends on
# twice: @node-rs/argon2 for password hashing and Prisma's query engine.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Match the local engine floor in package.json. Node 20+ puts the function on
  # Amazon Linux 2023, which is why schema.prisma lists rhel-openssl-3.0.x.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

  # esbuild cannot inline a .node binary. Bundling either of these produces a
  # function that builds cleanly and then throws at the first password check or
  # database query — mark them external so the real files are shipped instead.
  external_node_modules = ["@node-rs/argon2", "@prisma/client", "prisma"]

  # Output file tracing usually catches the generated client, but the engine is
  # written into .prisma at generate time and is easy to miss. Ship it explicitly.
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@node-rs/**",
  ]

# Belt and braces: next.config.ts sets these too, but a response served straight
# from the CDN (static asset, redirect) never passes through the Next.js header
# pipeline. These apply to everything.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
